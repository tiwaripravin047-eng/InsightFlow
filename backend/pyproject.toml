[project]
name = "feedback-intelligence-backend"
version = "0.1.0"
description = "Feedback Intelligence OS - Track A Backend, ML, and Analytics Engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sentence-transformers>=2.7.0",
    "hdbscan>=0.8.33",
    "bertopic>=0.16.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

